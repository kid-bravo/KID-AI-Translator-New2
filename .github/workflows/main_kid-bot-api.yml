name: Deploy API (KID-BOT-API-PROD) - New Tenant

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]

permissions:
  contents: read   # checkout

concurrency:
  group: deploy-api-new-prod
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy API (single job)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # ---- Preflight: validasi secret AZURE_CREDENTIALS (camelCase & JSON valid) ----
    

    # ---- (opsional) sanity install supaya error dependency cepat ketahuan ----
    - name: Install deps (sanity)
      shell: bash
      run: |
        set -e
        if [ -f requirements-api.txt ]; then
          pip install -r requirements-api.txt
        elif [ -f requirements.txt ]; then
          pip install -r requirements.txt
        else
          echo "No requirements file found, skipping pip install"
        fi

    # ---- paketkan source (zip) agar isi yang dikirim jelas ----
    - name: Create deployment zip
      shell: bash
      run: |
        set -e
        zip -r api_deploy.zip . -x "**/.git/**" "**/__pycache__/**" "**/.venv/**" "*.DS_Store"
        echo "=== ZIP CONTENTS (first 200 lines) ==="
        unzip -l api_deploy.zip | head -n 200

    # ---- LOGIN AZURE (SP JSON secret) ----
    #- name: Azure Login (Service Principal JSON)
    #  uses: azure/login@v1
    #  with:
    #    creds: ${{ secrets.AZURE_CREDENTIALS }}

    # ---- DEPLOY ----
    - name: Deploy to Azure Web App (API)
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'KID-BOT-API-PROD'
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_API_NEW }}
        package: 'api_deploy.zip'
